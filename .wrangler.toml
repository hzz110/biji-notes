# Cloudflare Pages 配置文件
# 此文件用于本地开发，实际部署通过 GitHub 集成自动完成

name = "biji-notes"
compatibility_date = "2024-01-01"

# D1 数据库配置
# 注意：在生产环境中，需要在 Cloudflare Dashboard 中创建 D1 数据库并绑定
# 本地开发时，使用 wrangler d1 create 创建本地数据库
[[d1_databases]]
binding = "DB"
database_name = "biji-notes-db"
database_id = ""  # 在 Cloudflare Dashboard 创建数据库后填写

# R2 存储配置
# 注意：在生产环境中，需要在 Cloudflare Dashboard 中创建 R2 存储桶并绑定
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "biji-images"  # R2 存储桶名称

[env.production]
name = "biji-notes"

